name: One-shot TEST admin bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-test-admin-once.yml

permissions:
  contents: read

concurrency:
  group: ghims-test-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-and-verify:
    name: Bootstrap and verify TEST administrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: g-hims-ai
      GHIMS_FIREBASE_PROJECT_ID_TEST: g-hims-ai
      FIRESTORE_DATABASE_ID: ai-studio-ghimsos-8d860f4b-3a80-47b3-bf97-15b9dc0d7fa7

      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

      GHIMS_BOOTSTRAP_ADMIN_EMAIL: irtiza.haider007@gmail.com
      GHIMS_BOOTSTRAP_ADMIN_TENANT: central-metro-hospital
      GHIMS_BOOTSTRAP_ADMIN_DISPLAY_NAME: Irtiza Haider
      GHIMS_BOOTSTRAP_CONFIRM_PROJECT: g-hims-ai
      GHIMS_ALLOW_ADMIN_BOOTSTRAP: "true"
      GHIMS_ALLOW_PRODUCTION_ADMIN_BOOTSTRAP: "false"
      EXPECTED_UID: q8Qxllf5GuOWtbL5j7eusQp7K863

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify TEST-only safety boundary
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GHIMS_RUNTIME_MODE" != "TEST" ]; then
            echo "Refusing bootstrap outside TEST." >&2
            exit 1
          fi

          if [ "$FIREBASE_PROJECT_ID" != "g-hims-ai" ]; then
            echo "Refusing bootstrap: wrong Firebase project." >&2
            exit 1
          fi

          if [ "$GHIMS_ALLOW_PRODUCTION_ADMIN_BOOTSTRAP" != "false" ]; then
            echo "Refusing bootstrap: production override must remain disabled." >&2
            exit 1
          fi

          if [ -z "$FIREBASE_CLIENT_EMAIL" ]; then
            echo "Missing GitHub secret: FIREBASE_CLIENT_EMAIL" >&2
            exit 1
          fi

          if [ -z "$FIREBASE_PRIVATE_KEY" ]; then
            echo "Missing GitHub secret: FIREBASE_PRIVATE_KEY" >&2
            exit 1
          fi

          case "$FIREBASE_CLIENT_EMAIL" in
            *@g-hims-ai.iam.gserviceaccount.com) ;;
            *)
              echo "Refusing bootstrap: service account is not for g-hims-ai." >&2
              exit 1
              ;;
          esac

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap existing Firebase identity
        shell: bash
        run: |
          set -euo pipefail
          bun run ops:bootstrap-admin | tee /tmp/bootstrap-result.json

      - name: Verify Firestore membership and Firebase claims
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { cert, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';

          const projectId = process.env.FIREBASE_PROJECT_ID;
          const clientEmail = process.env.FIREBASE_CLIENT_EMAIL;
          const privateKey = process.env.FIREBASE_PRIVATE_KEY.replace(/\\n/g, '\n');
          const uid = process.env.EXPECTED_UID;
          const tenantId = process.env.GHIMS_BOOTSTRAP_ADMIN_TENANT;
          const databaseId = process.env.FIRESTORE_DATABASE_ID;

          const app = initializeApp({
            credential: cert({ projectId, clientEmail, privateKey }),
            projectId,
          });

          const auth = getAuth(app);
          const db = getFirestore(app, databaseId);

          const user = await auth.getUser(uid);
          if (user.email !== 'irtiza.haider007@gmail.com') {
            throw new Error('BOOTSTRAP_VERIFY_EMAIL_MISMATCH');
          }

          const claims = user.customClaims || {};
          if (claims.tenantId !== tenantId) {
            throw new Error('BOOTSTRAP_VERIFY_CLAIM_TENANT_MISMATCH');
          }
          if (!Array.isArray(claims.roles) || !claims.roles.includes('administrator')) {
            throw new Error('BOOTSTRAP_VERIFY_ADMIN_CLAIM_MISSING');
          }

          const snap = await db.collection('tenants').doc(tenantId).collection('users').doc(uid).get();
          if (!snap.exists) throw new Error('BOOTSTRAP_VERIFY_MEMBERSHIP_MISSING');

          const membership = snap.data() || {};
          if (membership.status !== 'ACTIVE') throw new Error('BOOTSTRAP_VERIFY_MEMBERSHIP_NOT_ACTIVE');
          if (membership.role !== 'administrator') throw new Error('BOOTSTRAP_VERIFY_ROLE_MISMATCH');
          if (membership.email !== 'irtiza.haider007@gmail.com') throw new Error('BOOTSTRAP_VERIFY_MEMBERSHIP_EMAIL_MISMATCH');

          console.log(JSON.stringify({
            success: true,
            projectId,
            databaseId,
            tenantId,
            uid,
            email: user.email,
            role: membership.role,
            status: membership.status,
            claimsVerified: true
          }));
          EOF

      - name: Publish safe summary
        shell: bash
        run: |
          {
            echo "## G-HIMS TEST administrator bootstrap"
            echo ""
            echo "- Project: `g-hims-ai`"
            echo "- Tenant: `central-metro-hospital`"
            echo "- UID: `q8Qxllf5GuOWtbL5j7eusQp7K863`"
            echo "- Email: `irtiza.haider007@gmail.com`"
            echo "- Firestore membership: VERIFIED"
            echo "- Firebase custom claims: VERIFIED"
            echo "- Production bootstrap: DISABLED"
          } >> "$GITHUB_STEP_SUMMARY"
