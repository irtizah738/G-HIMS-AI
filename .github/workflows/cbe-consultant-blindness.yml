name: CBE Consultant Blindness Qualification

on:
  push:
    branches:
      - cbe/consultant-blindness-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cbe-consultant-blindness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cbe:
    name: CBE consultant visibility and coordination qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-cbe
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-cbe
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-cbe
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-cbe
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CBE consultant blindness guards
        run: bun run test:cbe

      - name: Wave 1 clinical coordination closure
        run: bun run test:wave1-clinical-coordination

      - name: Preserve Patient 360 and deterioration safety
        run: bun run test:ci7 && bun run test:ci8

      - name: Preserve main baseline hardening
        run: bun run test:p8

      - name: Preserve offline and controlled-pilot guarantees
        run: bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CBE — Consultant Blindness Eradication"
            echo ""
            echo "- Care-setting aware Patient 360 foundation: PASS"
            echo "- Persistent consultant attention ownership: PASS"
            echo "- Consultation lifecycle: PASS"
            echo "- Structured handoff lifecycle: PASS"
            echo "- Critical-result acknowledgement authority: PASS"
            echo "- Event-driven attention and escalation projection: PASS"
            echo "- OPD to IPD continuity handoff: PASS"
            echo "- Consultant Command Center authority boundary: PASS"
            echo "- Encrypted offline continuity with explicit staleness: PASS"
            echo "- Consultant blindness KPI coverage: PASS"
            echo "- P8 / CI-7 / CI-8 / P6 / P7 / security regression: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
