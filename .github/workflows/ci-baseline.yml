name: CI Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Typecheck, lint, full unit regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci-baseline
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci-baseline
      FIREBASE_PROJECT_ID: ghims-ci-baseline
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci-baseline
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify checked-in dependency lockfile authority
        run: |
          set -euo pipefail
          # The reviewed repository tracks npm's package-lock.json (v3).
          # Bun 1.4.2 can deterministically import it at install time; its
          # generated bun.lock is ephemeral and must not become competing source.
          test -f package-lock.json
          test ! -f bun.lock
          test ! -f yarn.lock
          test ! -f pnpm-lock.yaml
          node -e "const fs=require('fs'); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(l.lockfileVersion!==3 || l.name!==p.name || l.version!==p.version)process.exit(1)"

      - name: Frozen install from authoritative npm v3 lockfile
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          git diff --exit-code -- package-lock.json
          git ls-files --error-unmatch package-lock.json
      - name: TypeScript
        run: bun run typecheck
      - name: ESLint
        run: bun run lint
      - name: Full unit/domain regression
        run: bun run test:unit
      - name: Production build
        run: bun run build
