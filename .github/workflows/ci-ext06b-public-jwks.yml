name: CI-EXT-06B Epic Public JWKS Prerequisites

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-ext06b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epic-jku:
    name: Public JWK strict RSA, staging isolation and FHIR regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      GHIMS_FHIR_JWKS_ENVIRONMENT: ""
      GHIMS_CI_VENDOR_SANDBOX_PROBE_ENABLED: "false"
      GHIMS_CI_EXTERNAL_FHIR_IMPORT_ENABLED: "false"
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Source quality
        run: bun run lint
      - name: JKU public-only contracts
        run: bun test tests/ci-ext06b-public-jwks.test.ts
      - name: Existing SMART OAuth and vendor probe contracts
        run: bun test tests/ci-ext04-smart-backend-oauth.test.ts tests/ci-ext06-vendor-sandbox-probe.test.ts
