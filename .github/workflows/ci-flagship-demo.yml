name: Clinical Intelligence Flagship Demo

on:
  pull_request:
    paths:
      - 'scripts/demo/provision-clinical-intelligence-demo.ts'
      - 'docs/clinical-intelligence/FLAGSHIP_DEMO.md'
      - 'tests/ci-flagship-demo.test.ts'
      - 'types/patient360-projection.ts'
      - 'lib/clinical/patient360/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-flagship-demo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/demo/provision-clinical-intelligence-demo.ts'
      - 'docs/clinical-intelligence/FLAGSHIP_DEMO.md'
      - 'tests/ci-flagship-demo.test.ts'
      - 'types/patient360-projection.ts'
      - 'lib/clinical/patient360/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-flagship-demo.yml'

permissions:
  contents: read

jobs:
  flagship-demo:
    name: Synthetic CI demo qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Demo contract
        run: bun run test:ci-demo

      - name: Patient 360 regression
        run: bun run test:ci4

      - name: Clinical Intelligence safety regression
        run: bun run test:ci10h
