name: Clinical Intelligence Patient 360 Foundation

on:
  push:
    branches:
      - ci/patient360-foundation-ci0
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-patient360-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-foundation:
    name: CI-0 Patient 360 authority boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci-foundation
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci-foundation
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci-foundation
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci-foundation
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Patient 360 CI-0 foundation guards
        run: bun run test:ci-foundation

      - name: Preserve P6 offline-first guarantees
        run: bun run test:p6

      - name: Preserve P7 qualification guarantees
        run: bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Clinical Intelligence — CI-0"
            echo ""
            echo "- Canonical workflow contract: PASS"
            echo "- Client clinical authority guard: PASS"
            echo "- Inpatient encounter lifecycle: PASS"
            echo "- OPD/ED direct-admission bridge: PASS"
            echo "- Inpatient order/eMAR persistence: PASS"
            echo "- Pharmacy FEFO/inventory/consumption/charge atomicity: PASS"
            echo "- P6/P7/security regression: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
