name: Clinical Intelligence CI-1 Canonical Clinical Model

on:
  push:
    branches:
      - ci/patient360-ci1-canonical-clinical-model
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci1-canonical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci1:
    name: CI-1 canonical Patient 360 clinical model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci1
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci1
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci1
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci1
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Preserve CI-0 authority boundary
        run: bun run test:ci-foundation

      - name: CI-1 canonical clinical model guards
        run: bun run test:ci1

      - name: Preserve P6 offline-first guarantees
        run: bun run test:p6

      - name: Preserve P7 qualification guarantees
        run: bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Clinical Intelligence — CI-1"
            echo ""
            echo "- Canonical clinical fact model: PASS"
            echo "- Vitals → canonical Observation: PASS"
            echo "- Signed notes → canonical ClinicalDocument: PASS"
            echo "- Diagnostic orders → canonical DiagnosticOrder: PASS"
            echo "- Prescriptions → canonical MedicationOrder: PASS"
            echo "- Dispensing → canonical MedicationDispense: PASS"
            echo "- eMAR → canonical MedicationAdministration: PASS"
            echo "- Condition/allergy governed commands: PASS"
            echo "- CI-0/P6/P7/security regression: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
