name: Clinical Intelligence CI-10A Evidence Provenance

on:
  push:
    branches:
      - ci10/evidence-provenance-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci10-evidence-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci10a:
    name: CI-10A evidence and provenance qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci10
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci10
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CI-10A evidence provenance guards
        run: bun run test:ci10

      - name: Preserve CI-9 medication safety and consultant guarantees
        run: bun run test:ci9 && bun run test:cbe && bun run test:ci8

      - name: Preserve main baseline and offline/pilot guarantees
        run: bun run test:p8 && bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CI-10A — Evidence & Provenance Fabric"
            echo ""
            echo "- Immutable evidence snapshot contract: PASS"
            echo "- Patient 360 revision/checkpoint binding: PASS"
            echo "- Claim-to-evidence grounding: PASS"
            echo "- Foreign evidence rejection: PASS"
            echo "- Autonomous clinical action rejection: PASS"
            echo "- Provider-neutral model gateway: PASS"
            echo "- Authenticated Patient 360 access boundary: PASS"
            echo "- Server-only evidence storage: PASS"
            echo "- Immutable event + audit + outbox provenance: PASS"
            echo "- CI-9 / CBE / CI-8 / P8 / P6 / P7 / security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
