name: Clinical Intelligence CI-10B Longitudinal Summary

on:
  push:
    branches:
      - ci10/longitudinal-clinical-summary
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci10b-longitudinal-summary-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci10b:
    name: CI-10B longitudinal clinical summary qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci10b
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci10b
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10b
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10b
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CI-10B longitudinal summary guards
        run: bun run test:ci10b

      - name: Preserve CI-10A evidence provenance
        run: bun run test:ci10

      - name: Preserve CI-9 consultant and deterioration guarantees
        run: bun run test:ci9 && bun run test:cbe && bun run test:ci8

      - name: Preserve main baseline and offline/pilot guarantees
        run: bun run test:p8 && bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CI-10B — Longitudinal Clinical Summary"
            echo ""
            echo "- Canonical longitudinal evidence augmentation: PASS"
            echo "- Active/past problems and allergy knowledge semantics: PASS"
            echo "- Medication history/state summary: PASS"
            echo "- Procedures and diagnostics: PASS"
            echo "- Descriptive trends without inferred diagnosis: PASS"
            echo "- Outstanding investigations and follow-up: PASS"
            echo "- Missing data does not become a negative finding: PASS"
            echo "- Every emitted claim is evidence grounded: PASS"
            echo "- Read-only immutable summary persistence: PASS"
            echo "- Patient 360 evidence inspection UI: PASS"
            echo "- Server-only Firestore boundary: PASS"
            echo "- CI-10A / CI-9 / CBE / CI-8 / P8 / P6 / P7 / security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
