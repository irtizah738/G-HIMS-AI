name: Clinical Intelligence CI-10D Trend Intelligence

on:
  push:
    branches:
      - ci10/clinical-trend-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci10d-trend-intelligence-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci10d:
    name: CI-10D clinical trend intelligence qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci10d
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci10d
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10d
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10d
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CI-10D trend intelligence guards
        run: bun run test:ci10d

      - name: Preserve CI-10C, CI-10B and CI-10A guarantees
        run: bun run test:ci10c && bun run test:ci10b && bun run test:ci10

      - name: Preserve CI-9 consultant and deterioration guarantees
        run: bun run test:ci9 && bun run test:cbe && bun run test:ci8

      - name: Preserve offline and pilot guarantees
        run: bun run test:p8 && bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CI-10D — Clinical Trend Intelligence"
            echo ""
            echo "- Canonical coded metric identity: PASS"
            echo "- Corrected/superseded observation handling: PASS"
            echo "- Preliminary/cancelled/error exclusion: PASS"
            echo "- Mixed-unit fail-closed behavior: PASS"
            echo "- Same-time conflict detection: PASS"
            echo "- Quantitative component series: PASS"
            echo "- Deterministic direction/magnitude/slope: PASS"
            echo "- Source abnormality evidence: PASS"
            echo "- CI-10B delegates to CI-10D trend authority: PASS"
            echo "- Every explanation evidence-grounded: PASS"
            echo "- Immutable server-only trend artifact + audit/outbox: PASS"
            echo "- CI-10C/B/A / CI-9 / CBE / CI-8 / P8 / P6 / P7 / security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
