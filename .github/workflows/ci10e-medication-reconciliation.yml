name: Clinical Intelligence CI-10E Medication Reconciliation Copilot

on:
  push:
    branches:
      - ci10/medication-reconciliation-copilot
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci10e-medication-reconciliation-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci10e:
    name: CI-10E medication reconciliation copilot qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci10e
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci10e
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10e
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10e
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CI-10E medication reconciliation guards
        run: bun run test:ci10e

      - name: Preserve CI-10D/C/B/A guarantees
        run: bun run test:ci10d && bun run test:ci10c && bun run test:ci10b && bun run test:ci10

      - name: Preserve CI-9 consultant and deterioration guarantees
        run: bun run test:ci9 && bun run test:cbe && bun run test:ci8

      - name: Preserve offline and pilot guarantees
        run: bun run test:p8 && bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CI-10E — Medication Reconciliation Copilot"
            echo ""
            echo "- Medication order/history comparison: PASS"
            echo "- Canonical dispense/admin evidence comparison: PASS"
            echo "- Pre-encounter continuation-gap detection: PASS"
            echo "- Restarted therapy review: PASS"
            echo "- Regimen-change review: PASS"
            echo "- Dispense/order traceability checks: PASS"
            echo "- Dispense quantity arithmetic check: PASS"
            echo "- CI-9 duplicate/allergy/reconciliation integration: PASS"
            echo "- Missing evidence never converted into negative clinical fact: PASS"
            echo "- Every finding evidence-grounded: PASS"
            echo "- Human-authoritative reconciliation completion preserved: PASS"
            echo "- Immutable server-only artifact + audit/outbox: PASS"
            echo "- CI-10D/C/B/A / CI-9 / CBE / CI-8 / P8 / P6 / P7 / security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
