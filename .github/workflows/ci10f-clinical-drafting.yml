name: Clinical Intelligence CI-10F Governed Clinical Drafting

on:
  push:
    branches:
      - ci10/clinical-drafting
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci10f-clinical-drafting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci10f:
    name: CI-10F governed clinical drafting qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci10f
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci10f
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10f
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10f
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CI-10F governed drafting guards
        run: bun run test:ci10f

      - name: Preserve CI-10E/D/C/B/A guarantees
        run: bun run test:ci10e && bun run test:ci10d && bun run test:ci10c && bun run test:ci10b && bun run test:ci10

      - name: Preserve CI-9 consultant and deterioration guarantees
        run: bun run test:ci9 && bun run test:cbe && bun run test:ci8

      - name: Preserve offline and pilot guarantees
        run: bun run test:p8 && bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CI-10F — Governed Clinical Drafting"
            echo ""
            echo "- SOAP / encounter summary / handover / discharge / referral / patient instruction drafts: PASS"
            echo "- Frozen CI-10 evidence provenance: PASS"
            echo "- Provider failure fails closed; no fabricated clinical fallback: PASS"
            echo "- Immutable clinician-edited revisions: PASS"
            echo "- Explicit edit before approval: PASS"
            echo "- Exact revision approval hash: PASS"
            echo "- Explicit qualified-clinician signature: PASS"
            echo "- Stale approval / stale revision containment: PASS"
            echo "- Idempotent generation replay: PASS"
            echo "- Legacy AI signing bypass closed: PASS"
            echo "- Authoritative clinical document created only at signature: PASS"
            echo "- Server-only draft stores + audit/outbox: PASS"
            echo "- CI-10E/D/C/B/A / CI-9 / CBE / CI-8 / P8 / P6 / P7 / security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
