name: Clinical Intelligence CI-10G Copilot Workspace

on:
  push:
    branches:
      - ci10/copilot-workspace
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci10g-copilot-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci10g:
    name: CI-10G clinician copilot workspace qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci10g
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci10g
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10g
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci10g
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: CI-10G workspace guards
        run: bun run test:ci10g

      - name: Preserve CI-10F through CI-10A guarantees
        run: bun run test:ci10f && bun run test:ci10e && bun run test:ci10d && bun run test:ci10c && bun run test:ci10b && bun run test:ci10

      - name: Preserve CI-9 consultant and deterioration guarantees
        run: bun run test:ci9 && bun run test:cbe && bun run test:ci8

      - name: Preserve offline and pilot guarantees
        run: bun run test:p8 && bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS CI-10G — Clinician Copilot Workspace"
            echo ""
            echo "- Canonical Patient 360 copilot workspace: PASS"
            echo "- CI-10B/C/D/E unified read surface: PASS"
            echo "- CI-10F governed drafting lifecycle: PASS"
            echo "- No automatic intelligence generation: PASS"
            echo "- No bulk draft generation: PASS"
            echo "- Offline generation fail-closed: PASS"
            echo "- Revision + source-checkpoint staleness detection: PASS"
            echo "- Unified evidence provenance inspector: PASS"
            echo "- Legacy contextless copilot drawers detached: PASS"
            echo "- No direct browser clinical authority path: PASS"
            echo "- CI-10F/E/D/C/B/A / CI-9 / CBE / CI-8 / P8 / P6 / P7 / security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
