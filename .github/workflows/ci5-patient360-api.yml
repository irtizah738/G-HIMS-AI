name: Clinical Intelligence CI-5 Patient 360 API

on:
  push:
    branches:
      - ci/patient360-ci5-api
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci5-patient360-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci5:
    name: CI-5 secure Patient 360 API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ci5
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ci5
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci5
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ci5
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Preserve CI-0 authority boundary
        run: bun run test:ci-foundation

      - name: Preserve CI-1 canonical model
        run: bun run test:ci1

      - name: Preserve CI-2 terminology foundation
        run: bun run test:ci2

      - name: Preserve CI-3 diagnostics pipeline
        run: bun run test:ci3

      - name: Preserve CI-4 Patient 360 projection
        run: bun run test:ci4

      - name: CI-5 Patient 360 API guards
        run: bun run test:ci5

      - name: Preserve P6 offline-first guarantees
        run: bun run test:p6

      - name: Preserve P7 qualification guarantees
        run: bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Install Firestore rules tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase-tools

      - name: Patient 360 Firestore fail-closed verification
        run: npx firebase emulators:exec --project ghims-ci5 --only firestore "bun test emulator-security/firestore-rules.test.ts"

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Clinical Intelligence — CI-5"
            echo ""
            echo "- Authoritative tenant/session read boundary: PASS"
            echo "- Explicit full-chart authorization: PASS"
            echo "- Projection freshness + lag metadata: PASS"
            echo "- Cursor-paginated timeline: PASS"
            echo "- Source scans page without silent truncation: PASS"
            echo "- Direct Firestore Patient 360 reads denied: PASS"
            echo "- CI-0..CI-4/P6/P7/security regression: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
