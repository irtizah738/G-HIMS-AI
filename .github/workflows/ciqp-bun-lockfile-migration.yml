name: CIQP Generate Reviewed Bun Lockfile
on:
  push:
    branches:
      - feat/ciqp-clinical-validation-workspace-20261024
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/ciqp-bun-lockfile-migration.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Migrate npm lock to authoritative Bun text lockfile
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          test -s bun.lock
          sha256sum bun.lock
          echo GHIMS_LOCK_CONTENT_BEGIN
          sed 's/^/GHIMS_LOCK_CONTENT:/' bun.lock
          echo GHIMS_LOCK_CONTENT_END
