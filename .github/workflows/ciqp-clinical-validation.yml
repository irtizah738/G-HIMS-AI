name: CIQP Clinical Validation Workspace

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/clinical/validation/**"
      - "app/[tenantId]/clinical-validation/**"
      - "lib/clinical/validation/**"
      - "types/clinical-validation-workspace.ts"
      - "tests/ciqp-clinical-validation-workspace.test.ts"
      - "components/tenant/tenant-shell-header.tsx"
      - "firestore.rules"
      - "emulator-security/ciqp-validation-workspace-emulator.test.ts"
      - "lib/firebase/client.ts"
      - "lib/dev-sandbox/csp.ts"
      - "scripts/ops/ciqp-validation-browser-fixture.ts"
      - "e2e/ciqp-clinical-validation.browser.spec.ts"
      - "ciqp-playwright.config.ts"
      - ".github/workflows/ciqp-clinical-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-review-contract:
    name: CIQP synthetic review authority and build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-ciqp-synthetic
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-ciqp-synthetic
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ciqp-synthetic
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-ciqp-synthetic
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Java (Firebase emulators)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Blinded validation module tests
        run: bun test tests/ciqp-clinical-validation-workspace.test.ts
      - name: Clinical safety/source regressions
        run: bun run test:ci10d && bun run test:ci10h
      - name: Build
        run: bun run build
      - name: Install pinned Firebase emulator tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2
      - name: Auth, sessions, HCM and Firestore emulator end-to-end
        run: >
          npx firebase emulators:exec --project ghims-ciqp-synthetic
          --only firestore,auth
          "bun test emulator-security/ciqp-validation-workspace-emulator.test.ts"
      - name: Install isolated Chromium browser
        run: bunx playwright install --with-deps chromium
      - name: Browser UI with four independent synthetic TEST identities
        run: >
          npx firebase emulators:exec --project ghims-ciqp-synthetic
          --only firestore,auth
          "bun scripts/ops/ciqp-validation-browser-fixture.ts &&
          bunx playwright test --config=ciqp-playwright.config.ts"

