name: CIQP Readonly NPM Security Lock Migration
on:
  push:
    branches:
      - feat/ciqp-clinical-validation-workspace-20261024
    paths:
      - package.json
      - .github/workflows/ciqp-npm-zod-migration.yml
permissions:
  contents: read
jobs:
  npm-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile without installing or executing package scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.dependencies.zod!=='4.6.7'||l.packages['node_modules/zod'].version!=='4.6.7'||JSON.stringify(Object.entries(p.dependencies).sort())!==JSON.stringify(Object.entries(l.packages[''].dependencies).sort()))process.exit(1)"
          sha256sum package-lock.json
          echo CIQP_NPM_LOCK_BEGIN
          sed 's/^/CIQP_NPM_LOCK_LINE:/' package-lock.json
          echo CIQP_NPM_LOCK_END
