name: CIQP182 RC1 synthetic fixture emulator qualification

on:
  pull_request:
    paths:
      - scripts/ops/ciqp182-seed-hospital0-emulator.ts
      - emulator-security/ciqp182-synthetic-hospital0-fixture.test.ts
      - scripts/ops/ciqp182-emulator-restore-parity.ts
      - .github/workflows/ciqp182-rc1-fixture-emulator.yml
      - lib/clinical/patient360/ciqp-hosted-staging-readonly.ts
      - package.json
      - bun.lock
  push:
    branches: [main]
    paths:
      - scripts/ops/ciqp182-seed-hospital0-emulator.ts
      - emulator-security/ciqp182-synthetic-hospital0-fixture.test.ts
      - .github/workflows/ciqp182-rc1-fixture-emulator.yml
      - lib/clinical/patient360/ciqp-hosted-staging-readonly.ts

permissions:
  contents: read

jobs:
  synthetic-only-local:
    if: github.repository == 'irtizah738/G-HIMS-AI' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      NODE_ENV: test
      FIREBASE_PROJECT_ID: ghims-p4-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p4-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p4-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p4-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard exact emulator source and no hosted credential injection
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'irtizah738/G-HIMS-AI'
          test "$GITHUB_EVENT_NAME" = 'pull_request' || test "$GITHUB_REF" = 'refs/heads/main'
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${VERCEL:-}"
          test "$FIREBASE_PROJECT_ID" = 'ghims-p4-ci'
      - name: Install frozen project dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Firestore emulator
        run: npm install --global firebase-tools@15.30.2
      - name: Qualify fixture, export, fresh emulator import and exact evidence parity
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test "${FIREBASE_PROJECT_ID}" = 'ghims-p4-ci'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          baseline="$work/baseline.json"
          snapshot="$work/emulator-export"
          # First independent emulator process: write fabricated fixture,
          # read-only fingerprint, and export the disposable Firestore dataset.
          timeout --signal=TERM --kill-after=5s 300s firebase emulators:exec \
            --project ghims-p4-ci --only firestore \
            --export-on-exit="$snapshot" \
            "bun test --timeout 30000 emulator-security/ciqp182-synthetic-hospital0-fixture.test.ts && bun scripts/ops/ciqp182-emulator-restore-parity.ts capture '$baseline'"
          test -s "$baseline"
          test -f "$snapshot/firebase-export-metadata.json"
          # Second fresh emulator process: import the export and compare
          # Patient360, snapshots, canonical events and outbox. No hosted IAM.
          timeout --signal=TERM --kill-after=5s 300s firebase emulators:exec \
            --project ghims-p4-ci --only firestore \
            --import="$snapshot" \
            "bun scripts/ops/ciqp182-emulator-restore-parity.ts verify '$baseline'"
          echo 'CIQP182_EMULATOR_FRESH_EXPORT_IMPORT_PARITY_PASS'
          echo 'HOSTED_FIRESTORE_NOT_ACCESSED'
          echo 'CLINICAL_RELEASE_NOT_AUTHORIZED'
      - name: Check fixture TypeScript
        run: bun run typecheck
      - name: Record no hosted staging fixture population
        run: |
          echo 'CIQP182_SYNTHETIC_FIXTURE_EMULATOR_ONLY'
          echo 'HOSTED_FIRESTORE_WRITES_PERFORMED_FALSE'
          echo 'CLINICAL_RELEASE_AUTHORIZATION_NOT_GRANTED'
