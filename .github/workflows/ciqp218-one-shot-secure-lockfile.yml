name: CIQP-218 One-time secure npm lockfile refresh

on:
  push:
    branches: [fundraising/clinical-intelligence-demo-20261025]
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: ghims-ciqp218-lockfile-once
  cancel-in-progress: false

jobs:
  refresh:
    name: Safely generate reviewed package-lock.json, then retire this workflow
    if: github.repository == 'irtizah738/G-HIMS-AI' && github.ref == 'refs/heads/fundraising/clinical-intelligence-demo-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify reviewed manifest and one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "irtizah738/G-HIMS-AI"
          test "$GITHUB_REF" = "refs/heads/fundraising/clinical-intelligence-demo-20261025"
          node -e 'const p=require("./package.json"); if(p.dependencies.next!=="16.4.1"||p.dependencies.zod!=="4.6.7"||p.overrides["source-map-js"]!=="1.2.2") process.exit(1)'
          test -f package-lock.json
          test -f .github/workflows/ciqp218-one-shot-secure-lockfile.yml
          test -z "$(git status --porcelain)"
      - name: Regenerate npm v3 lock without executing dependency scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if(l.lockfileVersion!==3||l.packages[""].dependencies.next!=="16.4.1"||l.packages[""].dependencies.zod!=="4.6.7"||l.packages["node_modules/next"].version!=="16.4.1"||l.packages["node_modules/zod"].version!=="4.6.7") process.exit(1)'
          test -z "$(git status --porcelain --untracked-files=all | grep -v 'package-lock.json' || true)"
      - name: Commit lockfile only and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ciqp218-one-shot-secure-lockfile.yml
          git add package-lock.json
          git diff --cached --quiet && exit 1
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): resolve patched Next.js and Zod in npm lockfile'
          git push origin "HEAD:refs/heads/fundraising/clinical-intelligence-demo-20261025"
