name: One-shot connectivity-fix branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-connectivity-fix-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete verified merged branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          branch="fix/robust-preview-connectivity"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git merge-base --is-ancestor "origin/$branch" "origin/main"
            git push origin --delete "$branch"
          fi
