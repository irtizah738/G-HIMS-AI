name: One-time FAC/HCM merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-fac1-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove merged FAC/HCM branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete redundant merged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/fac%2Ffac1-authoritative-resource-foundation" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/hcm%2Fhcm1-workforce-trust-boundary" || true
