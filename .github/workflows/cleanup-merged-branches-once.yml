name: One-shot merged branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-merged-branches:
    name: Delete only branches fully merged into main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete verified merged branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --prune

          branches=(
            "fix/google-ai-dev-runtime"
            "hardening/pilot-readiness-p5c"
            "ops/staging-deploy-pipeline"
            "ops/staging-first-release-gate"
            "ops/test-admin-bootstrap"
            "ops/cleanup-merged-branches-once"
          )

          for branch in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Already absent: $branch"
              continue
            fi

            if ! git merge-base --is-ancestor "origin/$branch" "origin/main"; then
              echo "Refusing to delete $branch because it contains commits not merged into main." >&2
              exit 1
            fi

            echo "Deleting merged branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Publish cleanup summary
        shell: bash
        run: |
          {
            echo "## G-HIMS merged branch cleanup"
            echo ""
            echo "All targeted branch heads were verified as ancestors of `main` before deletion."
          } >> "$GITHUB_STEP_SUMMARY"
