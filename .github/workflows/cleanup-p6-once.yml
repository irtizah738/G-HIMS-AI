name: One-shot P6 branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-p6-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete superseded P6 development branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune

          branches=(
            "p6a/local-first-read-models"
            "p6bc/offline-registration-command-coverage"
            "p6d/server-causal-reconciliation"
            "p6e/unified-edge-storage"
            "p6f/encrypted-edge-storage"
            "p6g/offline-durability-qualification"
            "p6/offline-first-completion"
          )

          for branch in "${branches[@]}"; do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Deleting superseded branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
