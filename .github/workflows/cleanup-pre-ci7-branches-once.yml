name: One-shot pre-CI7 branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-reviewed-branches:
    name: Delete reviewed superseded branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete reviewed branches after cleanup merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "ci/patient360-atomicity"
            "ci/patient360-ci1-canonical-clinical-model"
            "ci/patient360-ci2-terminology"
            "ci/patient360-ci3-diagnostics"
            "ci/patient360-ci4-projection"
            "ci/patient360-ci5-api"
            "ci/patient360-ci5-clinical-read-surface"
            "ci/patient360-ci6-knowledge-status"
            "ci/patient360-foundation"
            "ci/patient360-foundation-ci0"
            "ops/p7a-staging-execution"
            "p7/controlled-live-pilot-qualification"
            "ops/pre-ci7-repository-cleanup"
            "ops/finalize-pre-ci7-cleanup"
          )

          for branch in "${branches[@]}"; do
            encoded=${branch//\//%2F}
            if ! gh api "repos/${GH_REPO}/git/ref/heads/${encoded}" >/dev/null 2>&1; then
              echo "Already absent: ${branch}"
              continue
            fi

            echo "Deleting reviewed superseded branch: ${branch}"
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${encoded}"
          done

          echo "Reviewed branch cleanup complete."

      - name: Remove this one-shot workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/cleanup-pre-ci7-branches-once.yml"
          workflow_sha="$(gh api "repos/${GH_REPO}/contents/${workflow_path}?ref=main" --jq .sha)"
          gh api             --method DELETE             "repos/${GH_REPO}/contents/${workflow_path}"             -f message="chore: remove completed pre-CI7 cleanup workflow"             -f sha="${workflow_sha}"             -f branch="main"
