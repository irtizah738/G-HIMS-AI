name: Clinical Intelligence Clinical Evaluation

on:
  pull_request:
    paths:
      - 'types/clinical-intelligence-evaluation.ts'
      - 'lib/clinical/intelligence/clinical-evaluation-framework.ts'
      - 'scripts/ops/clinical-intelligence-evaluate.ts'
      - 'tests/clinical-intelligence-evaluation.test.ts'
      - 'docs/clinical-intelligence/CLINICAL_EVALUATION_PROTOCOL.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/clinical-intelligence-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'types/clinical-intelligence-evaluation.ts'
      - 'lib/clinical/intelligence/clinical-evaluation-framework.ts'
      - 'scripts/ops/clinical-intelligence-evaluate.ts'
      - 'tests/clinical-intelligence-evaluation.test.ts'
      - 'docs/clinical-intelligence/CLINICAL_EVALUATION_PROTOCOL.md'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/clinical-intelligence-evaluation.yml'

permissions:
  contents: read

jobs:
  evaluation-contract:
    name: Clinical evaluation criteria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Clinical evaluation contract
        run: bun run test:ci-evaluation

      - name: Preserve CI-10H safety gate
        run: bun run test:ci10h
