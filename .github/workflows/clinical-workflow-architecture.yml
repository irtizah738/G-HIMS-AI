name: Clinical Workflow Architecture Contract

on:
  push:
    branches:
      - audit/clinical-workflow-architecture-contract
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clinical-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Clinical workflow architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-clinical-architecture
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-clinical-architecture
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-clinical-architecture
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-clinical-architecture
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Architecture contract
        run: bun run test:clinical-architecture

      - name: Preserve Clinical Intelligence
        run: bun run test:ci7 && bun run test:ci8

      - name: Preserve offline and pilot safety
        run: bun run test:p6 && bun run test:p7

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Clinical Workflow Architecture Contract"
            echo ""
            echo "- Clinical writes through governed commands: PASS"
            echo "- Immutable event/audit/outbox transaction boundary: PASS"
            echo "- Patient 360 longitudinal projection before CI: PASS"
            echo "- CI-7/CI-8 composed into clinician Patient 360: PASS"
            echo "- Bed Board escalation sourced from CI-8: PASS"
            echo "- Discharge requires current reviewed CI-7 context: PASS"
            echo "- AI remains draft-only: PASS"
            echo "- Offline intelligence remains encrypted/stale-labelled: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
