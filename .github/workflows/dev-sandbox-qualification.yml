name: DEV Sandbox Emulator Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - lib/dev-sandbox/**
      - lib/runtime/environment-contract.ts
      - lib/firebase/client.ts
      - server/auth/authorization-context.ts
      - scripts/dev-sandbox/**
      - tests/dev-sandbox-isolation.test.ts
      - .github/workflows/dev-sandbox-qualification.yml

permissions:
  contents: read

jobs:
  verify-sandbox:
    runs-on: ubuntu-latest
    env:
      GHIMS_RUNTIME_MODE: TEST
      NODE_ENV: development
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-dev-sandbox-local
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-dev-sandbox-local
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-dev-sandbox-local
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-dev-sandbox-local
      FIRESTORE_DATABASE_ID: (default)
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: (default)
      GHIMS_DEV_SANDBOX_TENANT_ID: dev-sandbox-hospital
      GHIMS_DEV_SANDBOX_ACK: I_CONFIRM_DISPOSABLE_LOCAL_EMULATORS_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Frozen dependency authority
        run: bun install --frozen-lockfile
      - name: Test fail-closed sandbox policy
        run: bun test tests/dev-sandbox-isolation.test.ts
      - name: Create ephemeral emulator-only credential
        run: echo "GHIMS_DEV_SANDBOX_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Exercise local Auth and Firestore seed, verify, reset and re-seed
        run: |
          npx --yes firebase-tools@14.22.0 emulators:exec --only auth,firestore --project ghims-dev-sandbox-local \
            "bun run dev:sandbox:seed && bun run dev:sandbox:verify && bun run dev:sandbox:rehearse && GHIMS_DEV_SANDBOX_RESET_ACK=RESET_DISPOSABLE_EMULATOR_TENANT bun run dev:sandbox:reset && bun run dev:sandbox:seed && bun run dev:sandbox:verify"
