name: One-time DRP Dependency Remediation

on:
  push:
    branches:
      - drp/staging-readiness-program
    paths:
      - .github/workflows/drp-dependency-remediation.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: drp-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Refresh lockfile and verify high-severity audit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drp/staging-readiness-program

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Refresh dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bun update

      - name: Require no high/critical advisories
        run: bun audit --audit-level high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            echo "Dependency graph already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "security(drp11): refresh remediated dependency lockfile"
          git push origin HEAD:drp/staging-readiness-program
