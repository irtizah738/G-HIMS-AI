name: DRP Security Qualification

on:
  push:
    branches:
      - drp/staging-readiness-program
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: drp-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: DRP-11 security qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-drp-security-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-drp-security-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-drp-security-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-drp-security-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Verify patched source-map-js resolution
        # GHSA-68fv-2mgg-jv7q affects source-map-js <1.2.2. The repository
        # override and lockfile must resolve only the patched 1.2.2 release.
        run: |
          bun -e "const lock = await Bun.file('bun.lock').text(); const versions = [...lock.matchAll(/source-map-js@([0-9.]+)/g)].map((match) => match[1]); const unique = [...new Set(versions)]; if (unique.length !== 1 || unique[0] !== '1.2.2') { console.error('Unsafe source-map-js resolution:', unique); process.exit(1); }"

      - name: Production dependency vulnerability audit
        # Clinical runtime qualification must fail on vulnerable production dependencies.
        # Bun currently reports GHSA-68fv-2mgg-jv7q against dependency range
        # metadata even though the frozen lockfile resolves the patched 1.2.2
        # release; the previous step proves that exact safe resolution first.
        # All other high/critical production advisories remain blocking.
        run: bun audit --prod --audit-level high --ignore GHSA-68fv-2mgg-jv7q

      - name: DRP security contracts
        run: bun test tests/drp11-security-qualification.test.ts

      - name: Existing penetration regressions
        run: bun run test:security

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase emulator tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2

      - name: Firestore authorization penetration suite
        run: bun run test:p0:rules

      - name: Auth/IAM emulator suite
        env:
          FIREBASE_PROJECT_ID: ghims-p5a-ci
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p5a-ci
          GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p5a-ci
          NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p5a-ci
        run: bun run test:p5a:emulator

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
