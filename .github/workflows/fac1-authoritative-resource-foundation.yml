name: FAC-1 Authoritative Facility and Biomedical Foundation

on:
  push:
    branches:
      - fac/fac1-authoritative-resource-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fac1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fac1:
    name: FAC-1 authoritative resource foundation gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-fac1-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-fac1-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-fac1-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-fac1-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run validate:fac1
