name: Facility Directory Export

on:
  workflow_dispatch:
  push:
    branches:
      - fix/firestore-facility-directory
    paths:
      - ".github/workflows/facility-directory-export.yml"
      - "scripts/ops/export-facility-directory.ts"

permissions:
  contents: write

concurrency:
  group: facility-directory-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export sanitized Firestore tenant directory
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.GHIMS_P7_STAGING_FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.GHIMS_P7_FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.GHIMS_P7_FIREBASE_PRIVATE_KEY }}
      FIRESTORE_DATABASE_ID: ai-studio-ghimsos-8d860f4b-3a80-47b3-bf97-15b9dc0d7fa7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Firebase export authority
        shell: bash
        run: |
          set -euo pipefail
          for key in FIREBASE_PROJECT_ID FIREBASE_CLIENT_EMAIL FIREBASE_PRIVATE_KEY FIRESTORE_DATABASE_ID; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required facility-directory export authority: $key" >&2
              exit 1
            fi
          done

      - name: Export sanitized facility directory
        run: bun scripts/ops/export-facility-directory.ts

      - name: Validate sanitized output
        shell: bash
        run: |
          set -euo pipefail
          test -s public/facility-directory.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("public/facility-directory.json", "utf8"));
            if (!Array.isArray(data.facilities) || data.facilities.length === 0) process.exit(1);
            for (const f of data.facilities) {
              const keys = Object.keys(f).sort().join(",");
              if (!["name,tenantId","facilityCode,name,tenantId"].includes(keys)) {
                throw new Error("Unexpected public facility-directory field set: " + keys);
              }
            }
          '

      - name: Commit refreshed directory
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/facility-directory.json && git ls-files --error-unmatch public/facility-directory.json >/dev/null 2>&1; then
            echo "Facility directory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/facility-directory.json
          git commit -m "chore(auth): refresh Firestore facility directory"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload directory evidence
        uses: actions/upload-artifact@v4
        with:
          name: facility-directory
          path: public/facility-directory.json
          if-no-files-found: error
          retention-days: 7
