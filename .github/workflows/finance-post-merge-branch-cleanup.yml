name: One-Time Finance Branch Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-finance-feature-branch:
    name: Delete merged Finance branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authenticated repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete merged Finance branch
        shell: bash
        run: |
          set -euo pipefail
          branch="finance/fin1-fin11-enterprise"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          else
            echo "Already absent: ${branch}"
          fi
