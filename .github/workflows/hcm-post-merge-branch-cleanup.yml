name: One-Time HCM Branch Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-hcm-branches:
    name: Delete merged and superseded HCM branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete obsolete HCM branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "hcm/hcm1-workforce-trust-boundary"
            "hcm/hcm2-credentialing-privileges"
            "hcm/hcm3-roster-fatigue"
            "hcm/hcm4-time-attendance"
            "hcm/hcm5-leave-availability"
            "hcm/hcm6-payroll-engine"
            "hcm/hcm7-payroll-finance"
            "hcm/hcm1-hcm11-enterprise"
            "hcm/hcm7-hcm11-final"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
