name: One-time Security Lockfile Refresh

on:
  push:
    branches: [fix/security-dependency-remediation-20261031]
    paths:
      - package.json
      - .github/workflows/one-time-security-lockfile-refresh.yml

permissions:
  contents: read

concurrency:
  group: ghims-security-lockfile-refresh-20261031
  cancel-in-progress: false

jobs:
  resolve-lockfile:
    if: github.repository == 'irtizah738/G-HIMS-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile from exact reviewed package changes without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency resolution
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          assert.equal(pkg.dependencies.next, '16.4.1');
          assert.equal(pkg.overrides.re2js, '2.8.7');
          assert.equal(lock.packages[''].dependencies.next, '16.4.1');
          assert.equal(lock.packages['node_modules/next']?.version, '16.4.1');
          const re2 = Object.entries(lock.packages).filter(([name]) => name.endsWith('/re2js'));
          assert.ok(re2.length > 0, 're2js must exist in lockfile');
          for (const [, info] of re2) assert.equal(info.version, '2.8.7');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

  commit-reviewed-lockfile:
    needs: resolve-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-patched-package-lock
          path: .
      - name: Commit only the newly resolved lockfile to the exact isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'irtizah738/G-HIMS-AI'
          test "$GITHUB_REF" = 'refs/heads/fix/security-dependency-remediation-20261031'
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.dependencies.next!=='16.4.1'||l.packages['node_modules/next'].version!=='16.4.1')process.exit(1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
            exit 0
          fi
          git commit -m 'fix(deps): regenerate authoritative lockfile for Next.js and RE2JS patches'
          git push origin "HEAD:refs/heads/fix/security-dependency-remediation-20261031"
