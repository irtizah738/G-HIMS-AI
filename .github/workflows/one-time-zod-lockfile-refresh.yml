name: One-time Patched Zod Lockfile Refresh

on:
  push:
    branches: [fix/security-dependency-remediation-20261031]
    paths:
      - package.json
      - .github/workflows/one-time-zod-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'irtizah738/G-HIMS-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact patched dependency versions
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./package.json'), l = require('./package-lock.json');
          for (const name of ['next','zod']) {
            assert.equal(l.packages['node_modules/' + name].version, p.dependencies[name]);
          }
          assert.equal(l.packages['node_modules/re2js'].version, '2.8.7');
          assert.equal(p.dependencies.next, '16.4.1');
          assert.equal(p.dependencies.zod, '4.6.6');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: patched-zod-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
  commit-lockfile:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patched-zod-package-lock
          path: .
      - name: Commit authoritative lockfile to exact fix branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'irtizah738/G-HIMS-AI'
          test "$GITHUB_REF" = 'refs/heads/fix/security-dependency-remediation-20261031'
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.dependencies.zod!=='4.6.6'||l.packages['node_modules/zod']?.version!=='4.6.6') process.exit(1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(deps): resolve patched Zod v4 compatibility lockfile'
          git push origin HEAD:refs/heads/fix/security-dependency-remediation-20261031
