name: Audited merged-branch retirement

on:
  push:
    branches: [main]
    paths:
      - 'docs/operations/orc-branch-retirement.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ghims-merged-branch-retirement
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'irtizah738/G-HIMS-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete only verified, unchanged, already-merged PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('docs/operations/orc-branch-retirement.json', 'utf8'));
            const { owner, repo } = context.repo;
            if (data.schema !== 'ghims.branch-retirement.v2' || !Array.isArray(data.branches) || data.branches.length !== 21) {
              core.setFailed('Unexpected audited branch retirement inventory or schema.');
              return;
            }
            const [open, closed, refs] = await Promise.all([
              github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100}),
              github.paginate(github.rest.pulls.list, {owner, repo, state: 'closed', per_page: 100}),
              github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100}),
            ]);
            const openHeads = new Set(open.map(pr => pr.head.ref));
            const prMap = new Map(closed.map(pr => [pr.number, pr]));
            const branchMap = new Map(refs.map(ref => [ref.name, ref]));
            const seen = new Set();
            // Preflight the entire fixed list, without deleting anything if a
            // ref or PR has changed. Squash-merged PRs retain non-ancestor SHAs.
            for (const entry of data.branches) {
              if (!entry || !/^(clinical|fix|hotfix|refactor)\/[a-z0-9-]+$/.test(entry.name) ||
                  entry.name === 'main' || seen.has(entry.name) ||
                  !/^[a-f0-9]{40}$/.test(entry.sha) || !Number.isInteger(entry.pr)) {
                core.setFailed('Unsafe inventory entry: ' + String(entry?.name));
                return;
              }
              seen.add(entry.name);
              const pr = prMap.get(entry.pr);
              if (!pr || pr.state !== 'closed' || !pr.merged_at ||
                  pr.head.ref !== entry.name || pr.head.sha !== entry.sha ||
                  pr.base.ref !== 'main' || openHeads.has(entry.name)) {
                core.setFailed('PR is not confirmed merged to main or is still active: ' + entry.name);
                return;
              }
              const current = branchMap.get(entry.name);
              if (current && (current.protected || current.commit.sha !== entry.sha)) {
                core.setFailed('Branch protected or moved since audit: ' + entry.name);
                return;
              }
            }
            let deleted = 0, alreadyAbsent = 0;
            for (const entry of data.branches) {
              if (!branchMap.has(entry.name)) {
                alreadyAbsent++;
                continue;
              }
              // Revalidate each ref immediately before deleting, in case of a
              // concurrent change after the initial audit.
              const current = await github.rest.git.getRef({owner, repo, ref: 'heads/' + entry.name});
              if (current.data.object.sha !== entry.sha) {
                core.setFailed('Concurrent branch update detected, stopped at ' + entry.name);
                return;
              }
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + entry.name});
              core.info('Removed merged and SHA-verified branch ' + entry.name);
              deleted++;
            }
            // Retire this workflow's own cleanup PR branch if and only if the
            // PR is already merged and its branch HEAD is unchanged.
            const cleanupName = data.cleanupBranch;
            const cleanupPr = closed.find(pr => pr.merged_at && pr.head.ref === cleanupName && pr.base.ref === 'main');
            const cleanupRef = branchMap.get(cleanupName);
            if (cleanupPr && cleanupRef && !cleanupRef.protected &&
                !openHeads.has(cleanupName) && cleanupPr.head.sha === cleanupRef.commit.sha) {
              const current = await github.rest.git.getRef({owner, repo, ref: 'heads/' + cleanupName});
              if (current.data.object.sha === cleanupRef.commit.sha) {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + cleanupName});
                deleted++;
                core.info('Removed merged cleanup branch ' + cleanupName);
              }
            }
            await core.summary.addHeading('G-HIMS merged branch retirement')
              .addRaw('Deleted: ' + deleted + '; already absent: ' + alreadyAbsent + '.')
              .addBreak()
              .addRaw('Main, open/draft PRs, and closed-unmerged work were preserved. No clinical data changed.')
              .write();
