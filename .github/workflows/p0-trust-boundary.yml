name: P0 Trust Boundary

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/core-trust-boundary-p0

permissions:
  contents: read

jobs:
  p0-trust-boundary:
    name: P0 trust-boundary validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p0-ci
      FIREBASE_PROJECT_ID: ghims-p0-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm ci

      - name: Install P0 emulator tooling
        run: npm install --no-save @firebase/rules-unit-testing firebase-tools

      - name: Source-level P0 regression guards
        run: bun run test:p0

      - name: Firestore rules integration tests
        run: bun run test:p0:rules

      - name: Production build / TypeScript
        run: npm run build
