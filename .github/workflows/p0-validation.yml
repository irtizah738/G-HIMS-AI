name: P0 Trust Boundary Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/core-trust-boundary-p0

permissions:
  contents: read

jobs:
  p0-validation:
    name: P0 security regression + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run P0 trust-boundary regression suite
        run: bun run test:p0

      - name: Production build and TypeScript validation
        run: bun run build
