name: P1 Durability Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/core-trust-boundary-p1

permissions:
  contents: read

jobs:
  p1-durability:
    name: P1 durable command infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p1-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p1-ci
      NEXT_TELEMETRY_DISABLED: "1"
      FIREBASE_PROJECT_ID: ghims-p1-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p1-ci
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      FIRESTORE_DATABASE_ID: "(default)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full G-HIMS regression suite
        run: bun run test

      - name: Production build and TypeScript validation
        run: bun run build

      - name: Install Firebase emulator CLI
        run: npm install --no-save --package-lock=false firebase-tools@15.30.2

      - name: Run P1 durability emulator suite
        run: npx firebase emulators:exec --project ghims-p1-ci --only firestore "bun test emulator-security/p1-durability.test.ts"
