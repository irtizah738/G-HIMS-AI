name: P2 Offline AI Interop Validation
on:
  pull_request:
    branches: [main, hardening/core-trust-boundary-p1]
  push:
    branches: [hardening/offline-ai-interop-p2]

permissions:
  contents: read

jobs:
  p2-safety:
    name: P2 offline AI interoperability boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p2-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p2-ci
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: INTEGRATION_READY
      GHIMS_INTEGRATION_DICOMWEB_STATE: SIMULATION
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: SIMULATION
      GHIMS_INTEGRATION_EDI_X12_STATE: INTEGRATION_READY
      NEXT_TELEMETRY_DISABLED: "1"
      FIREBASE_PROJECT_ID: ghims-p2-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p2-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: P2 boundary regression
        run: bun test tests/p2-offline-ai-interop-boundary.test.ts
      - name: Full regression
        run: bun run test
      - name: Production build and TypeScript validation
        run: bun run build
