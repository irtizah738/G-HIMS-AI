name: P3 Operational Assurance

on:
  pull_request:
    branches:
      - main
      - hardening/offline-ai-interop-p2
  push:
    branches:
      - hardening/ops-assurance-p3

permissions:
  contents: read

concurrency:
  group: p3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p3-assurance:
    name: P3 CI security observability DR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-p3-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p3-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p3-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p3-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint quality gate
        run: bun run lint

      - name: P3 operational assurance regression
        run: bun test tests/p3-operational-assurance.test.ts

      - name: Full unit and domain regression
        run: bun run test:unit

      - name: Security regression matrix
        run: bun run test:security

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore rules tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase-tools

      - name: Firestore tenant and durability rules
        run: bun run test:rules

      - name: Production build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Deployment smoke test
        run: bun run test:e2e
