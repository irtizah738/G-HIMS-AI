name: P5A Identity and Staging Access Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/identity-staging-access-p5a

permissions:
  contents: read

concurrency:
  group: p5a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p5a-identity:
    name: P5A identity, shared-device and IAM gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-p5a-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p5a-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p5a-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p5a-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint quality gate
        run: bun run lint

      - name: P5A source and authorization boundary
        run: bun run test:p5a

      - name: Full unit and domain regression
        run: bun run test:unit

      - name: P0-P3 security regression
        run: bun run test:security

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase emulator tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase-tools

      - name: Existing Firestore tenant and durability suites
        run: bun run test:rules

      - name: P5A Firebase Auth and IAM integration
        run: bun run test:p5a:emulator

      - name: Production build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Deployment fail-closed smoke
        run: bun run test:e2e
