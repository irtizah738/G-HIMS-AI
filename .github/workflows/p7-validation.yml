name: P7 Controlled Live Pilot Qualification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - p7/controlled-live-pilot-qualification

permissions:
  contents: read

concurrency:
  group: p7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p7-qualification:
    name: P7 qualification tooling and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-p7-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-p7-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p7-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-p7-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint quality gate
        run: bun run lint

      - name: P7 qualification guards
        run: bun run test:p7

      - name: Preserve P6 offline-first guarantees
        run: bun run test:p6

      - name: Security regression matrix
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Generate P7 external-evidence readiness manifest
        run: |
          mkdir -p artifacts/p7
          bun run ops:p7:evidence > p7-evidence-readiness.json

      - name: Upload P7 evidence readiness
        uses: actions/upload-artifact@v4
        with:
          name: ghims-p7-evidence-readiness-${{ github.sha }}
          path: p7-evidence-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish qualification summary
        shell: bash
        run: |
          {
            echo "## G-HIMS P7 qualification tooling"
            echo ""
            echo "- Code/tooling gate: PASS"
            echo "- P6 regression: PASS"
            echo "- Security regression: PASS"
            echo "- Build: PASS"
            echo "- External evidence: see uploaded readiness manifest"
            echo ""
            echo "This CI job does not claim P7B-P7G human/external gates have passed."
          } >> "$GITHUB_STEP_SUMMARY"
