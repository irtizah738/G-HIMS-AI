name: PRP-1 one-time STAGING launcher

on:
  push:
    branches:
      - prp/pilot-readiness-program
    paths:
      - .github/workflows/prp1-dispatch-staging.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch guarded main STAGING workflow
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch STAGING Deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run staging-deploy.yml --repo "$GH_REPO" --ref main -f confirm=STAGING
          echo "Dispatched staging-deploy.yml from main with confirm=STAGING."
