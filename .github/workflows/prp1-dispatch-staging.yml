name: PRP-1 STAGING observer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prp1-dispatch-staging.yml

permissions:
  contents: read
  actions: read

jobs:
  observe:
    name: Observe guarded main STAGING workflow
    runs-on: ubuntu-latest
    steps:
      - name: Report latest STAGING Deployment dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "LATEST_STAGING_RUNS"
          gh run list --repo "$GH_REPO" --workflow staging-deploy.yml --event workflow_dispatch --limit 5 \
            --json databaseId,status,conclusion,url,headSha,createdAt,displayTitle
