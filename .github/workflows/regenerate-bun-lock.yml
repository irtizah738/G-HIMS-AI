name: Regenerate Bun Lock

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/regenerate-bun-lock.yml

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate canonical Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate lockfile from package manifest
        run: bun install --lockfile-only
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock-${{ github.sha }}
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
