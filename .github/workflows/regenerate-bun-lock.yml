name: Regenerate Bun Lock

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/regenerate-bun-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate canonical Bun lockfile
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate lockfile from package manifest
        run: bun install --lockfile-only
      - name: Commit canonical lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate canonical Bun lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
