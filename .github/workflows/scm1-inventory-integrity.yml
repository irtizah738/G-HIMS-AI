name: SCM-1 Inventory Integrity Foundation

on:
  push:
    branches:
      - scm/scm1-inventory-integrity-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scm1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scm1:
    name: SCM-1 inventory integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-scm1-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-scm1-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-scm1-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-scm1-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: SCM-1 contract
        run: bun run test:scm1

      - name: Preserve P8 baseline
        run: bun run test:p8

      - name: Preserve offline replay
        run: bun run test:p6

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS SCM-1 Inventory Integrity"
            echo ""
            echo "- Atomic authoritative stock balance mutation: PASS"
            echo "- Atomic source/destination transfers: PASS"
            echo "- Patient consumption + stock depletion coupling: PASS"
            echo "- Requisition actor/facility canonicalization: PASS"
            echo "- Production synthetic seeding disabled: PASS"
            echo "- Source-aware FEFO ward movement: PASS"
            echo "- P8/P6/security regressions preserved: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
