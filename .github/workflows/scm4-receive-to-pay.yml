name: SCM-4 Receive-to-Pay Financial Integrity

on:
  push:
    branches:
      - scm/scm4-receive-to-pay
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scm4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scm4:
    name: SCM-4 receive-to-pay integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-scm4-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-scm4-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-scm4-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-scm4-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: SCM-1 inventory integrity
        run: bun run test:scm1
      - name: SCM-2 procure-to-receive
        run: bun run test:scm2
      - name: SCM-3 tenant boundary
        run: bun run test:scm3
      - name: SCM-4 receive-to-pay
        run: bun run test:scm4
      - name: P8 baseline regression
        run: bun run test:p8
      - name: Offline regression
        run: bun run test:p6
      - name: Security regression
        run: bun run test:security
      - name: Production build
        run: bun run build
      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS SCM-4 Receive-to-Pay Financial Integrity"
            echo ""
            echo "- Accepted GRN -> Inventory / GRNI accrual: PASS"
            echo "- Duplicate-safe supplier invoice capture: PASS"
            echo "- PO / GRN / invoice three-way matching: PASS"
            echo "- Over-invoicing prevention: PASS"
            echo "- Match exception maker-checker: PASS"
            echo "- GRNI -> AP recognition: PASS"
            echo "- Payment request / approval segregation: PASS"
            echo "- AP -> cash/bank settlement journal: PASS"
            echo "- SCM-1/2/3 + P8/P6/security/build regressions: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
