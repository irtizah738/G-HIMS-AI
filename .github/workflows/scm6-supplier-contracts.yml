name: SCM-6 Supplier and Contract Management

on:
  push:
    branches:
      - scm/scm6-supplier-contracts
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scm6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scm6:
    name: SCM-6 supplier contract integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-scm6-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-scm6-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-scm6-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-scm6-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: SCM regression 1-6
        run: bun run test:scm1 && bun run test:scm2 && bun run test:scm3 && bun run test:scm4 && bun run test:scm5 && bun run test:scm6
      - name: Baseline, offline and security
        run: bun run test:p8 && bun run test:p6 && bun run test:security
      - name: Production build
        run: bun run build
