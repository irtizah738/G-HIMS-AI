name: STAGING Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STAGING to deploy the current main commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghims-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy current main to G-HIMS STAGING and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # Vercel Hobby does not provide Custom Environments. We therefore use one
    # guarded Preview deployment as the G-HIMS STAGING trust domain. Automatic
    # Git deployments are disabled in vercel.json so Preview credentials are not
    # exposed to arbitrary feature-branch deployments.
    env:
      VERCEL_ORG_ID: team_0S9QQkyN4yTIj7QUZ9BVKsVV
      VERCEL_PROJECT_ID: prj_a0TEuNNMAE61UziOoLNTok6Wbp1v
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GHIMS_STAGING_EXPECTED_RUNTIME: STAGING
      GHIMS_STAGING_SMOKE_HEADER_NAME: x-vercel-protection-bypass
      GHIMS_STAGING_SMOKE_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Require explicit STAGING confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "STAGING" ]; then
            echo "Refusing deployment: confirmation must be exactly STAGING." >&2
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact current main head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$CHECKED_OUT_SHA" != "$REMOTE_MAIN_SHA" ]; then
            echo "Refusing stale staging deploy: checkout is not current origin/main." >&2
            exit 1
          fi
          echo "MAIN_SHA=$CHECKED_OUT_SHA" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify frozen Bun dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.19.1

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub secret is required." >&2
            exit 1
          fi
          vercel whoami --scope "$VERCEL_ORG_ID" >/dev/null

      - name: Pull Preview configuration for G-HIMS STAGING
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview

      - name: Pull STAGING environment for fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          vercel env pull .env.staging --yes --environment=preview

      - name: Validate isolated STAGING runtime contract
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.staging
          set +a
          bun run ops:staging-preflight | tee staging-preflight.json
          rm -f .env.staging

      - name: Build exact main with pulled STAGING configuration
        shell: bash
        run: |
          set -euo pipefail
          vercel build

      - name: Deploy prebuilt artifact as guarded Preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --yes 2>&1 | tee /tmp/vercel-staging-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/vercel-staging-deploy.log | tail -n 1 || true)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not resolve the guarded STAGING Preview URL from Vercel output." >&2
            exit 1
          fi
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Run fail-closed STAGING smoke gate
        shell: bash
        env:
          GHIMS_STAGING_BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          bun run ops:staging-smoke | tee staging-smoke.json

      - name: Pull STAGING environment for authenticated qualification
        shell: bash
        run: |
          set -euo pipefail
          vercel env pull .env.drp10 --yes --environment=preview
          chmod 600 .env.drp10

      - name: Provision isolated synthetic qualification tenant
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          QUALIFICATION_PASSWORD: ${{ secrets.GHIMS_P7_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          set -a
          source .env.drp10
          set +a

          if [ -z "$QUALIFICATION_PASSWORD" ]; then
            echo "GHIMS_P7_BOOTSTRAP_PASSWORD GitHub secret is required for authenticated staging qualification." >&2
            exit 1
          fi

          export GHIMS_RUNTIME_MODE=STAGING
          export NEXT_PUBLIC_GHIMS_RUNTIME_MODE=STAGING
          export GHIMS_P7_BASE_URL="$DEPLOYMENT_URL"
          export GHIMS_P7_TENANT_ID="drp10-${MAIN_SHA:0:12}"
          export GHIMS_P7_BOOTSTRAP_PASSWORD="$QUALIFICATION_PASSWORD"
          export GHIMS_P7_ALLOW_STAGING_PROVISION=true
          export GHIMS_P7_CONFIRM_PROJECT="$FIREBASE_PROJECT_ID"
          export GHIMS_DRP10_ALLOW_STAGING_PROVISION=true
          export GHIMS_DRP10_CONFIRM_PROJECT="$FIREBASE_PROJECT_ID"
          export GHIMS_P7_BYPASS_HEADER_NAME="$GHIMS_STAGING_SMOKE_HEADER_NAME"
          export GHIMS_P7_BYPASS_HEADER_VALUE="$GHIMS_STAGING_SMOKE_HEADER_VALUE"

          bun run ops:p7:provision | tee p7-provision.json
          bun run ops:drp10:provision | tee drp10-fixtures.json

      - name: Run authenticated P7 clinical qualification
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          QUALIFICATION_PASSWORD: ${{ secrets.GHIMS_P7_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          set -a
          source .env.drp10
          set +a
          export GHIMS_RUNTIME_MODE=STAGING
          export NEXT_PUBLIC_GHIMS_RUNTIME_MODE=STAGING
          export GHIMS_P7_BASE_URL="$DEPLOYMENT_URL"
          export GHIMS_P7_TENANT_ID="drp10-${MAIN_SHA:0:12}"
          export GHIMS_P7_BOOTSTRAP_PASSWORD="$QUALIFICATION_PASSWORD"
          export GHIMS_P7_BYPASS_HEADER_NAME="$GHIMS_STAGING_SMOKE_HEADER_NAME"
          export GHIMS_P7_BYPASS_HEADER_VALUE="$GHIMS_STAGING_SMOKE_HEADER_VALUE"
          bun run ops:p7:rehearsal | tee p7-rehearsal.json

      - name: Run DRP-10 cross-domain hospital qualification
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          QUALIFICATION_PASSWORD: ${{ secrets.GHIMS_P7_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          set -a
          source .env.drp10
          set +a
          export GHIMS_RUNTIME_MODE=STAGING
          export NEXT_PUBLIC_GHIMS_RUNTIME_MODE=STAGING
          export GHIMS_P7_BASE_URL="$DEPLOYMENT_URL"
          export GHIMS_P7_TENANT_ID="drp10-${MAIN_SHA:0:12}"
          export GHIMS_P7_BOOTSTRAP_PASSWORD="$QUALIFICATION_PASSWORD"
          export GHIMS_P7_BYPASS_HEADER_NAME="$GHIMS_STAGING_SMOKE_HEADER_NAME"
          export GHIMS_P7_BYPASS_HEADER_VALUE="$GHIMS_STAGING_SMOKE_HEADER_VALUE"
          export GHIMS_DRP10_P7_EVIDENCE_PATH=p7-rehearsal.json
          bun run ops:drp10:rehearsal | tee drp10-rehearsal.json
          rm -f .env.drp10

      - name: Record STAGING evidence
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          {
            echo "main_sha=$MAIN_SHA"
            echo "deployment_url=$DEPLOYMENT_URL"
            echo "vercel_environment=preview"
            echo "ghims_runtime=STAGING"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > staging-deployment-evidence.txt

      - name: Upload STAGING verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghims-staging-verification-${{ env.MAIN_SHA }}
          path: |
            staging-smoke.json
            staging-preflight.json
            p7-provision.json
            drp10-fixtures.json
            p7-rehearsal.json
            drp10-rehearsal.json
            staging-deployment-evidence.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish job summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## G-HIMS STAGING deployment"
            echo ""
            echo "- Commit: $MAIN_SHA"
            echo "- Vercel environment: preview"
            echo "- G-HIMS runtime: STAGING"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Smoke gate: PASS"
            echo "- Authenticated clinical qualification: PASS"
            echo "- Cross-domain DRP-10 qualification: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
