name: Temporary deterministic Bun lockfile repair (cleanup branch only)

on:
  push:
    branches:
      - refactor/extract-staging-to-ghims-os-20261011
    paths:
      - .github/workflows/temporary-bun-lockfile-repair.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-staging-to-ghims-os-20261011
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Generate real package resolution lockfile
        shell: bash
        run: |
          set -euo pipefail
          test ! -e bun.lock || { echo "A lockfile is already present; no regeneration" >&2; exit 1; }
          bun install
          test -s bun.lock
          bun install --frozen-lockfile
          bun audit --audit-level=high
          git add -- bun.lock
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: commit resolved Bun lockfile required by security CI"
          git push origin HEAD:refactor/extract-staging-to-ghims-os-20261011
