name: Wave 2 Clinical Domain Completion

on:
  push:
    branches:
      - wave2/clinical-domain-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wave2-clinical-domains-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave2:
    name: Wave 2 clinical domain authority qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-wave2-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-wave2-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave2-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave2-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Wave 2 domain authority
        run: bun run test:wave2

      - name: Patient 360 projection
        run: bun run test:ci4

      - name: Medication safety
        run: bun run test:ci9

      - name: Consultant coordination
        run: bun run test:cbe

      - name: Main baseline hardening
        run: bun run test:p8

      - name: Offline replay boundaries
        run: bun run test:p6

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Wave 2 — Clinical Domain Completion"
            echo ""
            echo "- Nursing/eMAR authority: PASS"
            echo "- Renal/dialysis lifecycle: PASS"
            echo "- Obstetric/partogram lifecycle: PASS"
            echo "- Oncology/tumor board lifecycle: PASS"
            echo "- Rehabilitation lifecycle: PASS"
            echo "- Patient 360 provenance: PASS"
            echo "- Offline replay safety: PASS"
            echo "- Security regressions: PASS"
            echo "- Production build: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
