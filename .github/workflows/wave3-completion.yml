name: Wave 3 Clinical Integration Completion

on:
  push:
    branches:
      - wave3b/emergency-telemetry-qualification
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wave3-completion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Wave 3 complete qualification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-wave3-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-wave3-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave3-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave3-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: LIVE
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Wave 3A IPD closure
        run: bun run test:wave3a
      - name: Wave 3B Emergency telemetry
        run: bun run test:wave3b
      - name: Wave 3C OR PACU
        run: bun run test:wave3c
      - name: Wave 3D Telehealth resilience
        run: bun run test:wave3d
      - name: Wave 3 combined contract
        run: bun test tests/wave3-completion.test.ts
      - name: Clinical Intelligence production qualification
        run: bun run test:ci10i
      - name: Hospital-0 evidence contract
        run: bun run test:hospital0-ci
      - name: Clinical Intelligence flagship demo contract
        run: bun run test:ci-demo
      - name: P8 baseline
        run: bun run test:p8
      - name: Offline resilience
        run: bun run test:p6
      - name: Security regression
        run: bun run test:security
      - name: Production build
        run: bun run build