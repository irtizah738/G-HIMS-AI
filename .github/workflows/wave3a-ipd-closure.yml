name: Wave 3A IPD Closure

on:
  push:
    branches:
      - wave3a/ipd-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wave3a-ipd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave3a:
    name: Wave 3A authoritative IPD closure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-wave3a-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-wave3a-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave3a-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave3a-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Wave 3A IPD closure
        run: bun run test:wave3a

      - name: Clinical workflow architecture
        run: bun run test:clinical-architecture

      - name: Discharge readiness
        run: bun run test:ci7

      - name: Patient 360
        run: bun run test:ci4

      - name: Consultant continuity
        run: bun run test:cbe

      - name: Main baseline hardening
        run: bun run test:p8

      - name: Offline safety
        run: bun run test:p6

      - name: Security regression
        run: bun run test:security

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Wave 3A — IPD Closure"
            echo ""
            echo "- Atomic OPD→IPD transition evidence: PASS"
            echo "- Patient 360-linked admission handoff: PASS"
            echo "- Signed discharge-summary provenance: PASS"
            echo "- CI-7 review provenance: PASS"
            echo "- Medication reconciliation provenance: PASS"
            echo "- Patient 360 v6 transition lineage: PASS"
            echo "- Legacy admission/discharge bypass closure: PASS"
            echo "- Offline/security/build regressions: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
