name: Wave 4 External Interoperability

on:
  push:
    branches:
      - wave4/external-interoperability
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wave4-external-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave4:
    name: Wave 4 engineering qualification
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-wave4-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-wave4-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave4-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave4-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Wave 4 protocol and authority tests
        run: bun run test:wave4
      - name: P2 interoperability safety boundary
        run: bun test tests/p2-offline-ai-interop-boundary.test.ts
      - name: Preserve Wave 3
        run: bun run test:wave3
      - name: P8 baseline
        run: bun run test:p8
      - name: Offline resilience
        run: bun run test:p6
      - name: Security regression
        run: bun run test:security
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore rules tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2

      - name: Firestore rules
        run: bun run test:rules
      - name: Production build
        run: bun run build
