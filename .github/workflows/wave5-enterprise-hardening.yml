name: Wave 5 Enterprise Hardening

on:
  push:
    branches:
      - wave5/enterprise-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: wave5-enterprise-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave5:
    name: Wave 5 engineering qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GHIMS_RUNTIME_MODE: TEST
      NEXT_PUBLIC_GHIMS_RUNTIME_MODE: TEST
      FIREBASE_PROJECT_ID: ghims-wave5-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ghims-wave5-ci
      GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave5-ci
      NEXT_PUBLIC_GHIMS_FIREBASE_PROJECT_ID_TEST: ghims-wave5-ci
      FIRESTORE_DATABASE_ID: "(default)"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: "(default)"
      GHIMS_INTEGRATION_AI_STATE: DISABLED
      GHIMS_INTEGRATION_HL7_STATE: DISABLED
      GHIMS_INTEGRATION_FHIR_R4_STATE: DISABLED
      GHIMS_INTEGRATION_DICOMWEB_STATE: DISABLED
      GHIMS_INTEGRATION_DEVICE_TELEMETRY_STATE: DISABLED
      GHIMS_INTEGRATION_EDI_X12_STATE: DISABLED
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Wave 5 contracts
        run: bun run test:wave5

      - name: Recovery architecture
        run: bun run test:drp7-9

      - name: Security qualification contract
        run: bun run test:drp11

      - name: Preserve Wave 4 interoperability
        run: bun run test:wave4

      - name: Preserve Wave 3 clinical integration
        run: bun run test:wave3

      - name: Main baseline
        run: bun run test:p8

      - name: Offline resilience
        run: bun run test:p6

      - name: Security regression
        run: bun run test:security

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firestore rules tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2

      - name: Firestore penetration rules
        run: npx firebase emulators:exec --project ghims-wave5-ci --only firestore "bun test emulator-security/firestore-rules.test.ts"

      - name: Production build
        run: bun run build

      - name: Summary
        shell: bash
        run: |
          {
            echo "## G-HIMS Wave 5 — Enterprise Hardening"
            echo ""
            echo "- Retention/governance contract: PASS"
            echo "- Recovery/failure-injection contract: PASS"
            echo "- Rollback/STAGING workflow contract: PASS"
            echo "- Wave 4 interoperability preservation: PASS"
            echo "- Wave 3 clinical preservation: PASS"
            echo "- Offline/security/rules: PASS"
            echo "- Production build: PASS"
            echo ""
            echo "Status: ENGINEERING_QUALIFIED only. Live STAGING/PILOT evidence is separate."
          } >> "$GITHUB_STEP_SUMMARY"
